name: ledgerbank
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledgerbank
      POSTGRES_USER: ledgerbank
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerbank}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerbank -d ledgerbank"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_DB: ledgerbank_test
      POSTGRES_USER: ledgerbank
      POSTGRES_PASSWORD: ledgerbank
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerbank -d ledgerbank_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
