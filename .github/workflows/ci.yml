name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate Maven Wrapper
        shell: bash
        run: |
          test -x ./mvnw
          grep -Eq '^distributionUrl=https://repo.maven.apache.org/maven2/.+\.zip$' .mvn/wrapper/maven-wrapper.properties
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' .mvn/wrapper/maven-wrapper.properties
          ./mvnw --batch-mode --version

      - name: Build and run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
