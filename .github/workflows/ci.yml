name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate Maven Wrapper
        shell: bash
        run: |
          test -x ./mvnw
          grep -Eq '^distributionUrl=https://repo.maven.apache.org/maven2/.+\.zip$' .mvn/wrapper/maven-wrapper.properties
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' .mvn/wrapper/maven-wrapper.properties
          ./mvnw --batch-mode --version

      - name: Build, test, and run quality checks
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Pquality

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Testcontainers integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run integration suite
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration,quality

      - name: Upload integration-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
