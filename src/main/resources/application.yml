spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  application:
    name: ledgerbank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
  rabbitmq:
    publisher-confirm-type: simple
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: false
springdoc:
  default-produces-media-type: application/json
  api-docs:
    version: OPENAPI_3_0
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
ledgerbank:
  auth:
    session-ttl: ${AUTH_SESSION_TTL:PT8H}
  idempotency:
    transfer-ttl: ${TRANSFER_IDEMPOTENCY_TTL:PT24H}
    lock-ttl: ${TRANSFER_IDEMPOTENCY_LOCK_TTL:PT30S}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.5S}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:PT1S}
    max-backoff: ${OUTBOX_MAX_BACKOFF:PT1M}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:PT5S}
    retention: ${OUTBOX_RETENTION:P7D}
    cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:PT1H}
  bootstrap-admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
